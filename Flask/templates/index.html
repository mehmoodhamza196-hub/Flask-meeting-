<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Cost Meter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;800&display=swap">
<style>
  :root {
    --bg: #f3f5f8; --panel: #ffffff; --ink: #162033; --muted: #607086; --line: #dde3ea;
    --brand: #1f3a8a; --run: #0f766e; --stop: #b42318; --soft: #eef2fb;
    --shadow: 0 1px 2px rgba(22,32,51,.06), 0 4px 16px rgba(22,32,51,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1623; --panel: #182235; --ink: #e8edf5; --muted: #98a6ba; --line: #2a3850;
            --brand: #8aa4ff; --run: #4fd1c5; --stop: #f08a80; --soft: #1f2c44; --shadow: none; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5;
         font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1040px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .bar h1 { margin: 0; font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; }
  .bar span { color: var(--muted); font-size: .9rem; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 20px 40px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 24px; }
  h2 { margin: 0 0 16px; font-size: 1rem; font-weight: 600; }

  /* Meter */
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); font-weight: 500; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .running .dot { background: var(--run); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .running .dot { animation: none; } }
  .cost { margin: 8px 0 4px; font-size: clamp(2.8rem, 11vw, 4.8rem); font-weight: 800; line-height: 1.05;
          letter-spacing: -.03em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .running .cost { color: var(--run); }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--soft); border-radius: 8px; padding: 12px 14px; }
  .stat small { display: block; color: var(--muted); font-size: .8rem; }
  .stat strong { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .buttons { display: flex; gap: 10px; }
  button { font: inherit; font-weight: 600; padding: 12px 18px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button:hover { background: var(--soft); }
  #toggle { flex: 1; background: var(--run); border-color: var(--run); color: #fff; }
  #toggle:hover { filter: brightness(1.08); }
  #toggle.running { background: var(--stop); border-color: var(--stop); }
  @media (prefers-color-scheme: dark) { #toggle { color: #08151f; } }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  /* Settings */
  .field { margin-bottom: 14px; }
  label { display: block; font-size: .88rem; font-weight: 500; margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 3px; }
  input, select { width: 100%; font: inherit; padding: 10px 12px; background: var(--panel); color: var(--ink);
                  border: 1px solid var(--line); border-radius: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 16px; }
  .total p { margin: 0 0 12px; min-height: 3em; }
  #copy { width: 100%; }
  .error { color: var(--stop); font-size: .8rem; min-height: 1.1em; margin: 4px 0 0; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Meeting Cost Meter</h1>
    <span>See what your meeting costs while it is happening.</span>
  </div>
</header>

<main>
  <section class="card" id="meter" aria-label="Live cost">
    <div class="status"><span class="dot"></span><span id="status">Not started</span></div>
    <p class="cost" id="cost">$0.00</p>
    <p class="sub" id="costSub">Total cost so far</p>

    <div class="stats">
      <div class="stat"><small>Elapsed</small><strong id="elapsed">00:00:00</strong></div>
      <div class="stat"><small>Group cost per minute</small><strong id="perMin">$0.00</strong></div>
      <div class="stat"><small>Group cost per hour</small><strong id="perHour">$0.00</strong></div>
    </div>

    <div class="buttons">
      <button id="toggle" type="button">Start meeting</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </section>

  <section class="card" aria-label="Settings">
    <h2>Meeting details</h2>

    <div class="field">
      <label for="people">Number of attendees</label>
      <input id="people" type="number" min="1" step="1" value="5" inputmode="numeric">
    </div>

    <div class="row">
      <div class="field">
        <label for="hourly">Rate per hour (each)</label>
        <input id="hourly" type="number" min="0" step="any" value="40" inputmode="decimal">
      </div>
      <div class="field">
        <label for="minute">Rate per minute (each)</label>
        <input id="minute" type="number" min="0" step="any" value="0.6667" inputmode="decimal">
      </div>
    </div>
    <p class="hint" style="margin-top:-6px">Change either rate and the other updates.</p>
    <p class="error" id="error" role="alert"></p>

    <div class="field">
      <label for="currency">Currency</label>
      <select id="currency">
        <option value="USD">US dollar (USD)</option>
        <option value="PKR">Pakistani rupee (PKR)</option>
        <option value="EUR">Euro (EUR)</option>
        <option value="GBP">British pound (GBP)</option>
        <option value="INR">Indian rupee (INR)</option>
        <option value="AED">UAE dirham (AED)</option>
      </select>
    </div>

    <div class="total">
      <h2>Summary</h2>
      <p id="summary">Start the meeting to generate a summary.</p>
      <button id="copy" type="button">Copy summary</button>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let elapsedMs = 0;     // time banked from earlier runs
  let startedAt = null;  // timestamp of the current run, null when paused
  let timer = null;

  const people = () => Math.max(1, Math.floor(Number($("people").value)) || 1);
  const perMinuteEach = () => Math.max(0, Number($("minute").value) || 0);
  const costPerSecond = () => (people() * perMinuteEach()) / 60;
  const totalMs = () => elapsedMs + (startedAt ? Date.now() - startedAt : 0);
  const totalCost = () => (totalMs() / 1000) * costPerSecond();

  function money(n) {
    try {
      return new Intl.NumberFormat(undefined, { style: "currency", currency: $("currency").value }).format(n);
    } catch { return n.toFixed(2); }
  }

  function clock(ms) {
    const s = Math.floor(ms / 1000), p = (n) => String(n).padStart(2, "0");
    return `${p(Math.floor(s / 3600))}:${p(Math.floor((s % 3600) / 60))}:${p(s % 60)}`;
  }

  function summaryText() {
    const ms = totalMs();
    if (ms < 1000) return "Start the meeting to generate a summary.";
    const mins = Math.max(1, Math.round(ms / 60000));
    return `${people()} ${people() === 1 ? "attendee" : "attendees"} spent ${mins} ` +
           `${mins === 1 ? "minute" : "minutes"} in this meeting. Total cost: ${money(totalCost())}.`;
  }

  function render() {
    $("cost").textContent = money(totalCost());
    $("elapsed").textContent = clock(totalMs());
    $("perMin").textContent = money(costPerSecond() * 60);
    $("perHour").textContent = money(costPerSecond() * 3600);
    $("costSub").textContent = `Based on ${people()} ${people() === 1 ? "attendee" : "attendees"}`;
    $("summary").textContent = summaryText();
  }

  function setRunning(on) {
    $("meter").classList.toggle("running", on);
    $("toggle").classList.toggle("running", on);
    $("status").textContent = on ? "Meeting in progress" : (elapsedMs > 0 ? "Paused" : "Not started");
    $("toggle").textContent = on ? "Pause meeting" : (elapsedMs > 0 ? "Resume meeting" : "Start meeting");
  }

  function start() { startedAt = Date.now(); timer = setInterval(render, 100); setRunning(true); }
  function pause() { elapsedMs = totalMs(); startedAt = null; clearInterval(timer); setRunning(false); render(); }

  $("toggle").addEventListener("click", () => (startedAt ? pause() : start()));
  $("reset").addEventListener("click", () => {
    clearInterval(timer); elapsedMs = 0; startedAt = null; setRunning(false); render();
  });

  // Keep hourly and per-minute rates linked
  function syncRates(source) {
    const raw = $(source).value;
    const val = Number(raw);
    const bad = raw === "" || !isFinite(val) || val < 0;
    $("error").textContent = bad ? "Enter a rate of 0 or more." : "";
    if (bad) return;
    if (source === "hourly") $("minute").value = +(val / 60).toFixed(4);
    else $("hourly").value = +(val * 60).toFixed(2);
    render();
  }
  $("hourly").addEventListener("input", () => syncRates("hourly"));
  $("minute").addEventListener("input", () => syncRates("minute"));
  ["people", "currency"].forEach((id) => $(id).addEventListener("input", render));

  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("summary").textContent); $("copy").textContent = "Copied"; }
    catch { $("copy").textContent = "Copy failed"; }
    setTimeout(() => ($("copy").textContent = "Copy summary"), 1500);
  });

  render();
</script>
</body>
</html>
